name: Build CartelGo Personal APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-apk-test/**'
      - '.github/workflows/build-personal-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android-apk-test assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-apk-test/app/build/outputs/apk/debug/app-debug.apk CartelGo-Personal-Test-v2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartelGo-Personal-Test-v2
          path: CartelGo-Personal-Test-v2.apk
          if-no-files-found: error
